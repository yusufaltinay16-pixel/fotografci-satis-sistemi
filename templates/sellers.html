{% extends "base.html" %}{% block content %}<section class="panel"><h1>Fotoğrafçı hesabı oluştur</h1><form method="post" class="formgrid"><label>Ad soyad<input name="full_name" required></label><label>Kullanıcı adı<input name="username" required></label><label>İlk şifre<input name="password" required></label><label>Satış yüzdesi (%)<input type="number" name="commission" min="0" max="100" step="0.01" required></label><button>Fotoğrafçı ekle</button></form></section><h2>Fotoğrafçılar ve yüzdeleri</h2>{% for s in rows %}<section class="panel"><form method="post" action="{{url_for('seller_update',sid=s.id)}}" class="inlineform"><strong>{{s.full_name}}</strong><span>{{s.username}}</span><label>Yüzde<input type="number" name="commission" min="0" max="100" step="0.01" value="{{s.commission}}"></label><label>Durum<select name="active"><option value="1" {% if s.active %}selected{% endif %}>Aktif</option><option value="0" {% if not s.active %}selected{% endif %}>Pasif</option></select></label><button>Güncelle</button></form></section>{% endfor %}{% endblock %}
