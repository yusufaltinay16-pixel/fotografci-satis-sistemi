{% extends "base.html" %}{% block content %}<section class="panel"><h1>Fotoğrafçıya ödeme yap</h1><form method="post" class="formgrid"><label>Fotoğrafçı<select name="seller_id">{% for s in sellers %}<option value="{{s.id}}">{{s.full_name}}</option>{% endfor %}</select></label><label>Ödeme tarihi<input type="date" name="payment_date" value="{{today}}" required></label><label>Ödenen tutar (TL)<input type="number" name="amount" step="0.01" min="0.01" required></label><label>Açıklama<input name="note"></label><button>Ödemeyi kaydet</button></form></section><h2>Ödeme geçmişi</h2><div class="tablewrap"><table><tr><th>Tarih</th><th>Fotoğrafçı</th><th>Tutar</th><th>Açıklama</th></tr>{% for r in rows %}<tr><td>{{r.payment_date}}</td><td>{{r.full_name}}</td><td>{{r.amount}} TL</td><td>{{r.note}}</td></tr>{% endfor %}</table></div>{% endblock %}
