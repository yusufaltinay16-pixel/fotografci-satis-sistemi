{% extends "base.html" %}{% block content %}<section class="panel"><h1>Döviz kuru gir</h1><form method="post" class="formgrid"><label>Tarih<input type="date" name="rate_date" value="{{today}}" required></label><label>Para birimi<select name="currency"><option>USD</option><option>EUR</option></select></label><label>1 birimin TL karşılığı<input type="number" step="0.0001" min="0.0001" name="rate" required></label><button>Kaydet</button></form></section><h2>Girilen kurlar</h2><div class="tablewrap"><table><tr><th>Tarih</th><th>Döviz</th><th>Kur</th></tr>{% for r in rows %}<tr><td>{{r.rate_date}}</td><td>{{r.currency}}</td><td>{{r.rate}}</td></tr>{% endfor %}</table></div>{% endblock %}
