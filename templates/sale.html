{% extends "base.html" %}{% block content %}<section class="panel"><h1>{% if edit_mode %}Satışı düzenle{% else %}Yeni satış kaydı{% endif %}</h1><form method="post" action="{% if edit_mode %}{{url_for('edit_sale',sale_id=sale_record.id)}}{% else %}{{url_for('sale')}}{% endif %}" class="formgrid">
{% if me['role']=='admin' %}<label>Fotoğrafçı<select name="seller_id" required>{% for s in sellers %}<option value="{{s.id}}"{% if edit_mode and sale_record.seller_id==s.id %} selected{% endif %}>{{s.full_name}}</option>{% endfor %}</select></label>{% endif %}
<label>Satış tarihi<input type="date" name="sale_date" value="{% if edit_mode %}{{sale_record.sale_date}}{% else %}{{today}}{% endif %}" required></label>
<label>Fotoğraf adedi<input type="number" name="quantity" min="1" step="1" value="{% if edit_mode %}{{sale_record.quantity}}{% else %}1{% endif %}" required></label>
<label>Teslim şekli<select name="delivery_type" required>{% for choice in ['Ücretli baskı','Telefona gönderim','Bedelsiz baskı'] %}<option value="{{choice}}"{% if edit_mode and sale_record.delivery_type==choice %} selected{% elif not edit_mode and choice=='Ücretli baskı' %} selected{% endif %}>{{choice}}{% if choice=='Ücretli baskı' %} (kâğıt){% elif choice=='Telefona gönderim' %} (kâğıt yok){% else %} / misafir (ücretsiz){% endif %}</option>{% endfor %}</select></label>
<label>Satış tutarı<input type="number" name="amount" min="0" step="0.01" value="{% if edit_mode %}{{sale_record.amount}}{% else %}0{% endif %}" required><small>Bedelsiz baskıda tutar otomatik sıfır kaydedilir.</small></label>
<label>Para birimi<select name="currency">{% for cur in ['TL','USD','EUR'] %}<option{% if edit_mode and sale_record.currency==cur %} selected{% elif not edit_mode and cur=='TL' %} selected{% endif %}>{{cur}}</option>{% endfor %}</select></label>
<label>Ödeme türü<select name="payment_type">{% for p in ['Nakit','Kredi kartı','IBAN'] %}<option{% if edit_mode and sale_record.payment_type==p %} selected{% elif not edit_mode and p=='Nakit' %} selected{% endif %}>{{p}}</option>{% endfor %}</select></label>
<label class="wide">Not (isteğe bağlı)<input name="note" value="{% if edit_mode %}{{sale_record.note}}{% endif %}"></label><button class="wide">{% if edit_mode %}Değişiklikleri kaydet{% else %}Satışı kaydet{% endif %}</button>{% if edit_mode %}<a class="wide" href="{{url_for('dashboard')}}">Vazgeç</a>{% endif %}</form></section>{% endblock %}
